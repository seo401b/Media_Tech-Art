<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호작도</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: #0d0c0a; 
            user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        #cors-fallback { 
            display: none; 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(245, 238, 228, 0.96); 
            color: #2b241f; 
            padding: 32px 42px; 
            text-align: center; 
            border: 1px solid #c5b6a1; 
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 100; 
            font-size: 13px;
            font-family: sans-serif;
            line-height: 1.8;
        }
        #cors-fallback input { margin-top: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="cors-fallback">
        <p>로컬 보안 설정으로 'hojak.jpeg'를 직접 읽을 수 없습니다.<br>동일 폴더의 <b>hojak.jpeg</b> 파일을 선택해 주세요.</p>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <canvas id="mainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let img = new Image();
        let isImageLoaded = false;

        // 한지 배경
        let hanjiCanvas = document.createElement('canvas');
        let hanjiCtx = hanjiCanvas.getContext('2d');

        // 이미지 데이터 분석용
        let sampleCanvas = document.createElement('canvas');
        let sampleCtx = sampleCanvas.getContext('2d');

        // 필선 누적용
        let strokeCanvas = document.createElement('canvas');
        let strokeCtx = strokeCanvas.getContext('2d');

        let imgPixels = null;
        let sampleW = 0, sampleH = 0;
        let drawX = 0, drawY = 0, drawW = 0, drawH = 0;

        let activeStrokes = []; 
        let transitionStrokes = []; 
        let totalStrokeCount = 0;
        let maxStrokes = 24000; 

        // 4가지 화법 정의
        const MODES = [
            { maxStrokes: 26000, speed: 180 },
            { maxStrokes: 24000, speed: 160 },
            { maxStrokes: 22000, speed: 180 },
            { maxStrokes: 20000, speed: 150 }
        ];
        let currentModeIdx = 0;

        // 상태 제어: 'drawing' -> 'completed' -> 'transition'
        let state = 'drawing'; 
        let completionTime = 0;
        const VIEWING_DURATION = 5.0; // 완성작 감상 시간 5초

        let transitionProgress = 0;
        const TRANSITION_DURATION = 6.0; // 6초 간의 부드러운 해체
        let transitionStartTime = 0;

        // 마우스 호버 설정 (범위 좁게 75px)
        let mouse = { x: -2000, y: -2000, radius: 75 };

        function resize() {
            width = canvas.width = hanjiCanvas.width = strokeCanvas.width = window.innerWidth;
            height = canvas.height = hanjiCanvas.height = strokeCanvas.height = window.innerHeight;
            generateHanji();
            if (isImageLoaded) {
                initSampling();
            }
        }
        window.addEventListener('resize', resize);

        // 1. 닥나무 한지 결 생성
        function generateHanji() {
            hanjiCtx.fillStyle = '#f4ede1';
            hanjiCtx.fillRect(0, 0, width, height);

            hanjiCtx.strokeStyle = 'rgba(175, 158, 136, 0.12)';
            hanjiCtx.lineWidth = 0.5;
            for (let i = 0; i < 700; i++) {
                let x = Math.random() * width;
                let y = Math.random() * height;
                let len = Math.random() * 30 + 10;
                let ang = Math.random() * Math.PI;
                hanjiCtx.beginPath();
                hanjiCtx.moveTo(x, y);
                hanjiCtx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
                hanjiCtx.stroke();
            }
        }

        // 2. 이미지 샘플링 준비
        function initSampling() {
            let scale = Math.min((width * 0.82) / img.width, (height * 0.82) / img.height);
            drawW = Math.floor(img.width * scale);
            drawH = Math.floor(img.height * scale);
            drawX = Math.floor((width - drawW) / 2);
            drawY = Math.floor((height - drawH) / 2);

            sampleW = sampleCanvas.width = drawW;
            sampleH = sampleCanvas.height = drawH;
            sampleCtx.drawImage(img, 0, 0, sampleW, sampleH);

            let imgData = sampleCtx.getImageData(0, 0, sampleW, sampleH);
            imgPixels = imgData.data;

            strokeCtx.clearRect(0, 0, width, height);
            activeStrokes = [];
            transitionStrokes = [];
            totalStrokeCount = 0;
            state = 'drawing';
            transitionProgress = 0;

            let curMode = MODES[currentModeIdx];
            maxStrokes = curMode.maxStrokes;
        }

        function getNoiseAngle(x, y) {
            let scale = 0.005;
            let val = Math.sin(x * scale) * Math.cos(y * scale) + Math.sin((x + y) * scale * 1.5);
            return val * Math.PI * 2;
        }

        // 4가지 화법 알고리즘 붓질 매니저
        function generateStrokesForMode(batchSize) {
            if (!imgPixels || totalStrokeCount >= maxStrokes || state !== 'drawing') return;

            strokeCtx.save();
            strokeCtx.globalCompositeOperation = 'multiply';

            let added = 0;
            let attempts = 0;

            while (added < batchSize && attempts < batchSize * 6) {
                attempts++;

                let rx = Math.floor(Math.random() * sampleW);
                let ry = Math.floor(Math.random() * sampleH);

                let idx = (ry * sampleW + rx) * 4;
                let r = imgPixels[idx];
                let g = imgPixels[idx + 1];
                let b = imgPixels[idx + 2];
                let a = imgPixels[idx + 3];

                if (a < 20) continue;

                let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                let acceptProb = (1 - brightness / 255) * 0.88 + 0.08;
                if (Math.random() > acceptProb) continue;

                let startX = drawX + rx;
                let startY = drawY + ry;
                let progress = totalStrokeCount / maxStrokes;

                let endX = startX;
                let endY = startY;
                let ctrlX = startX;
                let ctrlY = startY;
                let strokeW = 1.0;
                let alpha = 0.5;
                let type = 'line';

                // --- 화법 1: 낙필 ---
                if (currentModeIdx === 0) {
                    let angle = getNoiseAngle(rx, ry) * 0.3 + (Math.random() - 0.5) * 1.2;
                    let len = Math.random() * (18 - progress * 8) + 5;
                    strokeW = Math.random() * (2.8 - progress * 1.4) + 0.5;
                    alpha = (1 - brightness / 255) * 0.55 + 0.15;
                    endX = startX + Math.cos(angle) * len;
                    endY = startY + Math.sin(angle) * len;
                    ctrlX = (startX + endX) / 2 + (Math.random() - 0.5) * 5;
                    ctrlY = (startY + endY) / 2 + (Math.random() - 0.5) * 5;

                    strokeCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    strokeCtx.lineWidth = strokeW;
                    strokeCtx.lineCap = 'round';
                    strokeCtx.beginPath();
                    strokeCtx.moveTo(startX, startY);
                    strokeCtx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
                    strokeCtx.stroke();
                    type = 'curve';
                }
                // --- 화법 2: 기운 ---
                else if (currentModeIdx === 1) {
                    let angle = getNoiseAngle(rx, ry);
                    let len = Math.random() * 22 + 8;
                    strokeW = Math.random() * 1.8 + 0.6;
                    alpha = (1 - brightness / 255) * 0.65 + 0.12;
                    endX = startX + Math.cos(angle) * len;
                    endY = startY + Math.sin(angle) * len;

                    strokeCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    strokeCtx.lineWidth = strokeW;
                    strokeCtx.lineCap = 'round';
                    strokeCtx.beginPath();
                    strokeCtx.moveTo(startX, startY);
                    strokeCtx.lineTo(endX, endY);
                    strokeCtx.stroke();
                    type = 'line';
                }
                // --- 화법 3: 철선묘 ---
                else if (currentModeIdx === 2) {
                    let rightIdx = (ry * sampleW + Math.min(sampleW - 1, rx + 1)) * 4;
                    let bottomIdx = (Math.min(sampleH - 1, ry + 1) * sampleW + rx) * 4;
                    let dx = imgPixels[rightIdx] - r;
                    let dy = imgPixels[bottomIdx] - r;
                    let angle = Math.atan2(dy, dx) + Math.PI / 2;

                    let len = Math.random() * 10 + 4;
                    strokeW = (1 - brightness / 255) > 0.6 ? 2.0 : 0.8;
                    alpha = (1 - brightness / 255) * 0.8 + 0.2;
                    endX = startX + Math.cos(angle) * len;
                    endY = startY + Math.sin(angle) * len;

                    strokeCtx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    strokeCtx.lineWidth = strokeW;
                    strokeCtx.lineCap = 'square';
                    strokeCtx.beginPath();
                    strokeCtx.moveTo(startX, startY);
                    strokeCtx.lineTo(endX, endY);
                    strokeCtx.stroke();
                    type = 'line';
                }
                // --- 화법 4: 파묵 ---
                else {
                    strokeW = Math.random() * (5.5 - progress * 2.8) + 1.2;
                    alpha = (1 - brightness / 255) * 0.72 + 0.18;

                    strokeCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                    strokeCtx.beginPath();
                    strokeCtx.arc(startX, startY, strokeW / 2, 0, Math.PI * 2);
                    strokeCtx.fill();
                    type = 'dot';
                }

                activeStrokes.push({
                    x: startX,
                    y: startY,
                    endX: endX,
                    endY: endY,
                    ctrlX: ctrlX,
                    ctrlY: ctrlY,
                    r: r,
                    g: g,
                    b: b,
                    alpha: alpha,
                    width: strokeW,
                    type: type,
                    stagger: Math.random(),
                    speedFactor: Math.random() * 0.8 + 0.6,
                    rotSpd: (Math.random() - 0.5) * 0.15,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5
                });

                added++;
                totalStrokeCount++;
            }

            strokeCtx.restore();

            if (totalStrokeCount >= maxStrokes && state === 'drawing') {
                state = 'completed';
                completionTime = Date.now() / 1000;
            }
        }

        function startTransition() {
            state = 'transition';
            transitionStartTime = Date.now() / 1000;

            let step = Math.max(1, Math.floor(activeStrokes.length / 3800));
            transitionStrokes = [];
            for (let i = 0; i < activeStrokes.length; i += step) {
                transitionStrokes.push(activeStrokes[i]);
            }
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -2000;
            mouse.y = -2000;
        });

        img.onload = () => {
            isImageLoaded = true;
            document.getElementById('cors-fallback').style.display = 'none';
            resize();
            requestAnimationFrame(render);
        };
        img.onerror = () => {
            document.getElementById('cors-fallback').style.display = 'block';
        };
        img.src = 'hojak.jpeg';

        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { img.src = event.target.result; }
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        function render() {
            if (!isImageLoaded) return;

            let now = Date.now() / 1000;

            if (state === 'drawing') {
                let curBatchSpeed = MODES[currentModeIdx].speed;
                generateStrokesForMode(curBatchSpeed);
            } 
            else if (state === 'completed') {
                let elapsed = now - completionTime;
                if (elapsed >= VIEWING_DURATION) {
                    startTransition();
                }
            }

            ctx.clearRect(0, 0, width, height);

            if (state === 'transition') {
                let transElapsed = now - transitionStartTime;
                transitionProgress = Math.min(1.0, transElapsed / TRANSITION_DURATION);

                // 1. 한지 바탕
                ctx.drawImage(hanjiCanvas, 0, 0);

                // 2. 완성된 원본 그림 레이어가 천천히 옅어지며 은은하게 배경으로 깔림
                let bgFade = Math.max(0, 1.0 - transitionProgress * 1.8);
                if (bgFade > 0) {
                    ctx.save();
                    ctx.globalAlpha = bgFade;
                    ctx.drawImage(strokeCanvas, 0, 0);
                    ctx.restore();
                }

                // 3. 필선 해체 트랜지션
                ctx.save();
                ctx.globalCompositeOperation = 'multiply';

                for (let i = 0; i < transitionStrokes.length; i++) {
                    let s = transitionStrokes[i];

                    let strokeProgress = (transitionProgress - s.stagger * 0.4) / 0.6;
                    if (strokeProgress <= 0) continue;

                    let p = Math.min(1.0, strokeProgress * s.speedFactor);
                    let fade = Math.max(0, 1.0 - p * 1.1);
                    if (fade <= 0) continue;

                    let offsetX = 0;
                    let offsetY = 0;
                    let angleRot = 0;

                    if (currentModeIdx === 0) {
                        let gravity = Math.pow(p, 2.0) * (height * 0.7);
                        offsetY = gravity;
                        offsetX = Math.sin(p * 8 + s.x) * 6;
                    } else if (currentModeIdx === 1) {
                        offsetX = Math.pow(p, 1.8) * (width * 0.5) + Math.sin(p * 6) * 15;
                        offsetY = -Math.pow(p, 1.5) * (height * 0.3);
                        angleRot = p * s.rotSpd * 2;
                    } else if (currentModeIdx === 2) {
                        let push = Math.pow(p, 1.5) * 280;
                        offsetX = s.vx * push;
                        offsetY = s.vy * push;
                        angleRot = p * s.rotSpd * 3;
                    } else {
                        offsetY = Math.pow(p, 1.8) * (height * 0.45);
                        offsetX = (Math.sin(p * 4 + s.y) * 12);
                    }

                    ctx.save();
                    ctx.translate(s.x + offsetX, s.y + offsetY);
                    if (angleRot !== 0) ctx.rotate(angleRot);

                    let drawAlpha = s.alpha * fade;
                    ctx.strokeStyle = `rgba(${s.r}, ${s.g}, ${s.b}, ${drawAlpha})`;
                    ctx.fillStyle = `rgba(${s.r}, ${s.g}, ${s.b}, ${drawAlpha})`;
                    ctx.lineWidth = s.width;

                    let relEndX = s.endX - s.x;
                    let relEndY = s.endY - s.y;
                    let relCtrlX = s.ctrlX - s.x;
                    let relCtrlY = s.ctrlY - s.y;

                    if (s.type === 'dot') {
                        ctx.beginPath();
                        ctx.arc(0, 0, (s.width / 2) * (1 + p * 0.3), 0, Math.PI * 2);
                        ctx.fill();
                    } else if (s.type === 'curve') {
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(relCtrlX, relCtrlY, relEndX, relEndY);
                        ctx.stroke();
                    } else {
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(relEndX, relEndY);
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                ctx.restore();

                if (transitionProgress >= 1.0) {
                    currentModeIdx = (currentModeIdx + 1) % MODES.length;
                    initSampling();
                }

            } else {
                // 정상 감상 및 드로잉 상태
                ctx.drawImage(hanjiCanvas, 0, 0);
                ctx.drawImage(strokeCanvas, 0, 0);

                // [요청사항 반영: 마우스 위치에 원본 선명하게 비추기 (좁은 반경 75px)]
                if (mouse.x > 0 && mouse.y > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
                    ctx.clip();

                    ctx.globalCompositeOperation = 'multiply';
                    ctx.globalAlpha = 0.9;
                    ctx.drawImage(img, drawX, drawY, drawW, drawH);

                    // 좁은 반경 가장자리 테두리 선
                    ctx.strokeStyle = 'rgba(160, 140, 115, 0.25)';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    ctx.restore();
                }
            }

            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
