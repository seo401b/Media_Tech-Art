<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호작도 - 3D Interactive Fur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background-color: #0d0c0a; 
            touch-action: none; 
            user-select: none;
        }
        #webgl-container { display: block; width: 100%; height: 100%; cursor: crosshair; }

        #cors-fallback { 
            display: none; 
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(245, 238, 228, 0.96); 
            color: #2b241f; 
            padding: 32px 42px; 
            text-align: center; 
            border: 1px solid #c5b6a1; 
            border-radius: 4px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            z-index: 100; 
            font-size: 13px;
            font-family: sans-serif;
            line-height: 1.8;
        }
        #cors-fallback input { margin-top: 18px; cursor: pointer; }
        #hidden-canvas { display: none; }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
</head>
<body>
    <div id="cors-fallback">
        <p>로컬 보안 설정으로 'hojak.jpeg'를 직접 읽을 수 없습니다.<br>동일 폴더의 <b>hojak.jpeg</b> 파일을 선택해 주세요.</p>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div id="webgl-container"></div>
    <canvas id="hidden-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('webgl-container');
        const fallbackUI = document.getElementById('cors-fallback');
        
        let scene, camera, renderer;
        let instancedMesh;
        
        const FUR_RESOLUTION = 250;
        const mouse = new THREE.Vector2(9999, 9999);
        const targetMouse = new THREE.Vector2(9999, 9999);
        let time = 0;

        function initThreeJS(imageSrc) {
            if (renderer) {
                container.innerHTML = '';
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color('#151411'); 

            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
            camera.position.z = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            loadAndAnalyzeImage(imageSrc);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('mouseout', onMouseOut);
            window.addEventListener('touchend', onMouseOut);
        }

        function loadAndAnalyzeImage(src) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            
            img.onload = () => {
                fallbackUI.style.display = 'none';
                
                const cvs = document.getElementById('hidden-canvas');
                const ctx = cvs.getContext('2d', { willReadFrequently: true });
                
                let scale = Math.min((window.innerWidth * 0.9) / img.width, (window.innerHeight * 0.9) / img.height);
                let drawW = Math.floor(img.width * scale);
                let drawH = Math.floor(img.height * scale);
                
                cvs.width = FUR_RESOLUTION;
                cvs.height = Math.floor(FUR_RESOLUTION * (drawH / drawW));
                
                ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
                const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height).data;

                createFurMesh(cvs.width, cvs.height, imgData, drawW, drawH);
            };

            img.onerror = () => {
                fallbackUI.style.display = 'block';
            };

            img.src = src;
        }

        function createFurMesh(gridW, gridH, imgData, drawW, drawH) {
            const totalHairs = gridW * gridH;
            
            const geometry = new THREE.PlaneGeometry(1, 1, 1, 4);
            geometry.translate(0, 0.5, 0);
            
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uMouse: { value: new THREE.Vector2(9999, 9999) },
                    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform vec2 uMouse;
                    uniform vec2 uResolution;
                    
                    attribute vec3 aColor;
                    attribute vec2 aPosInfo;
                    attribute float aLength;
                    attribute float aRandom;
                    
                    varying vec3 vColor;
                    varying float vV;

                    vec2 hash( vec2 p ) {
                        p = vec2( dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)) );
                        return -1.0 + 2.0*fract(sin(p)*43758.5453123);
                    }
                    float noise( in vec2 p ) {
                        const float K1 = 0.366025404;
                        const float K2 = 0.211324865;
                        vec2 i = floor( p + (p.x+p.y)*K1 );
                        vec2 a = p - i + (i.x+i.y)*K2;
                        vec2 o = (a.x>a.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
                        vec2 b = a - o + K2;
                        vec2 c = a - 1.0 + 2.0*K2;
                        vec3 h = max( 0.5-vec3(dot(a,a), dot(b,b), dot(c,c) ), 0.0 );
                        vec3 n = h*h*h*h*vec3( dot(a,hash(i+0.0)), dot(b,hash(i+o)), dot(c,hash(i+1.0)));
                        return dot( n, vec3(70.0) );
                    }

                    void main() {
                        vColor = aColor;
                        vV = position.y;
                        
                        vec2 basePos = aPosInfo;
                        
                        // --- 1. 아주 잔잔한 미풍 (Wind Idle) ---
                        float windSpeed = uTime * 0.8; // 천천히 흐르는 바람
                        float windForce = noise(basePos * 4.0 + vec2(windSpeed, 0.0)) * 0.035; // 0.15 -> 0.035 대폭 축소
                        vec2 windOffset = vec2(windForce, -abs(windForce)*0.3); 
                        
                        // --- 2. 마우스 인터랙션 (범위 축소 & 부드럽게) ---
                        vec2 screenPos = basePos;
                        vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);
                        vec2 diff = (screenPos - uMouse) * aspect;
                        float dist = length(diff);
                        
                        // 영향 반경을 0.15에서 0.075로 절반 축소
                        float effectRadius = 0.075; 
                        vec2 mouseForce = vec2(0.0);
                        
                        if(dist < effectRadius) {
                            vec2 dir = normalize(diff);
                            // 밀려나는 힘을 0.25에서 0.07로 약화
                            float strength = (1.0 - (dist / effectRadius)) * 0.07;
                            mouseForce = dir * strength;
                        }

                        // --- 3. 최종 오프셋 계산 ---
                        vec2 totalOffset = (windOffset + mouseForce) * (vV * vV);
                        
                        vec3 finalPos = position;
                        finalPos.x *= 0.003;
                        finalPos.y *= aLength;
                        
                        finalPos.x += totalOffset.x;
                        finalPos.y += totalOffset.y;

                        vec4 mvPosition = viewMatrix * instanceMatrix * vec4(finalPos, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vColor;
                    varying float vV;
                    
                    void main() {
                        float alpha = smoothstep(1.0, 0.85, vV); 
                        vec3 finalColor = mix(vColor * 0.4, vColor * 1.1, vV);
                        gl_FragColor = vec4(finalColor, alpha);
                    }
                `,
                transparent: true,
                depthWrite: false
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, totalHairs);
            const dummy = new THREE.Object3D();
            
            const colorArray = new Float32Array(totalHairs * 3);
            const posInfoArray = new Float32Array(totalHairs * 2);
            const lengthArray = new Float32Array(totalHairs);
            const randomArray = new Float32Array(totalHairs);

            let index = 0;
            const aspectW = drawW / window.innerWidth;
            const aspectH = drawH / window.innerHeight;

            for (let y = 0; y < gridH; y++) {
                for (let x = 0; x < gridW; x++) {
                    const idx = (y * gridW + x) * 4;
                    const r = imgData[idx] / 255;
                    const g = imgData[idx+1] / 255;
                    const b = imgData[idx+2] / 255;
                    const a = imgData[idx+3];

                    if (a < 50) continue;

                    const nx = (x / gridW) * 2 - 1;
                    const ny = -(y / gridH) * 2 + 1;
                    
                    const finalX = nx * aspectW;
                    const finalY = ny * aspectH;

                    dummy.position.set(finalX, finalY, 0);
                    dummy.rotation.z = (Math.random() - 0.5) * 0.4;
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(index, dummy.matrix);

                    colorArray[index * 3 + 0] = r;
                    colorArray[index * 3 + 1] = g;
                    colorArray[index * 3 + 2] = b;
                    
                    posInfoArray[index * 2 + 0] = finalX;
                    posInfoArray[index * 2 + 1] = finalY;

                    const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                    const baseLen = 0.025 + (brightness * 0.045);
                    lengthArray[index] = baseLen * (0.8 + Math.random() * 0.4);
                    
                    randomArray[index] = Math.random();

                    index++;
                }
            }

            instancedMesh.count = index;

            geometry.setAttribute('aColor', new THREE.InstancedBufferAttribute(colorArray, 3));
            geometry.setAttribute('aPosInfo', new THREE.InstancedBufferAttribute(posInfoArray, 2));
            geometry.setAttribute('aLength', new THREE.InstancedBufferAttribute(lengthArray, 1));
            geometry.setAttribute('aRandom', new THREE.InstancedBufferAttribute(randomArray, 1));

            scene.add(instancedMesh);
            
            updateCameraAspect();
            renderer.setAnimationLoop(animate);
        }

        function updateMousePos(clientX, clientY) {
            targetMouse.x = (clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseMove(e) {
            updateMousePos(e.clientX, e.clientY);
        }

        function onTouchMove(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
            }
        }

        function onMouseOut() {
            targetMouse.set(9999, 9999);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraAspect();
        }

        function updateCameraAspect() {
            if(!camera || !instancedMesh) return;
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -1;
            camera.right = 1;
            camera.top = 1 / aspect;
            camera.bottom = -1 / aspect;
            
            if(aspect < 1) {
                camera.left = -aspect;
                camera.right = aspect;
                camera.top = 1;
                camera.bottom = -1;
            }
            camera.updateProjectionMatrix();
            instancedMesh.material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
        }

        function animate() {
            time += 0.016;

            // 마우스 보간 속도를 0.15 -> 0.08로 줄여 조금 더 부드럽고 천천히 추적
            mouse.lerp(targetMouse, 0.08);

            if (instancedMesh) {
                instancedMesh.material.uniforms.uTime.value = time;
                instancedMesh.material.uniforms.uMouse.value.copy(mouse);
            }

            renderer.render(scene, camera);
        }

        initThreeJS('hojak.jpeg');

        document.getElementById('imageLoader').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => { initThreeJS(event.target.result); }
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });
    </script>
</body>
</html>
