<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>윤슬의 숨결: 시공의 조각</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            user-select: none;
        }
        #canvas-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; 
        }
        
        /* Intro UI */
        #intro-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            background: rgba(0,0,0,0.85); color: white; transition: opacity 1.5s ease-in-out; 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .title-group { text-align: center; margin-bottom: 50px; }
        h1 { 
            font-weight: 300; letter-spacing: 12px; font-size: 2rem; margin: 0 0 10px 12px; 
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .subtitle { 
            font-style: italic; font-size: 1rem; letter-spacing: 3px; color: rgba(255,255,255,0.6); 
        }
        #start-btn { 
            pointer-events: auto; padding: 16px 48px; font-size: 1.1rem; 
            background: transparent; border: 1px solid rgba(255,255,255,0.4); 
            color: white; cursor: pointer; border-radius: 4px; letter-spacing: 2px;
            transition: all 0.4s ease; font-weight: 300;
        }
        #start-btn:hover { 
            background: rgba(255,255,255,0.1); border-color: white; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* In-Art Info Panel (Bottom Left) */
        #info-panel { 
            position: absolute; bottom: 30px; left: 30px; z-index: 5; 
            color: rgba(255,255,255,0.85); pointer-events: none; 
            display: flex; flex-direction: column; gap: 4px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            opacity: 0; transition: opacity 2s;
        }
        .time-display { font-size: 1.6rem; font-weight: 300; letter-spacing: 2px; }
        .theme-display { font-size: 0.9rem; letter-spacing: 1px; color: rgba(255,255,255,0.65); }

        /* Control Panel (Top Right) */
        #control-panel {
            position: absolute; top: 30px; right: 30px; z-index: 5;
            display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
            opacity: 0; transition: opacity 2s; pointer-events: none;
        }
        .control-group {
            display: flex; align-items: center; gap: 10px; pointer-events: auto;
            background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 14px; border-radius: 20px; backdrop-filter: blur(10px);
        }
        .icon-btn, .text-btn {
            background: transparent; border: none;
            color: rgba(255,255,255,0.8); cursor: pointer;
            transition: all 0.3s ease; font-size: 0.85rem; letter-spacing: 1px;
            display: flex; justify-content: center; align-items: center;
        }
        .text-btn.active {
            color: #ffd085; font-weight: 500; text-shadow: 0 0 8px rgba(255, 208, 133, 0.5);
        }
        .icon-btn:hover, .text-btn:hover { color: white; }
        
        /* Time Slider */
        .slider-container {
            display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.7); font-size: 0.8rem;
        }
        input[type=range] {
            -webkit-appearance: none; width: 150px; background: rgba(255,255,255,0.2);
            height: 3px; border-radius: 2px; outline: none; transition: background 0.3s;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #ffffff; cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,0.8); transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .instruction {
            position: absolute; bottom: 30px; right: 30px; z-index: 5;
            font-size: 0.8rem; color: rgba(255,255,255,0.4); letter-spacing: 1px; text-align: right;
            pointer-events: none; opacity: 0; transition: opacity 2s;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- 작품 내 정보 -->
    <div id="info-panel">
        <div class="time-display" id="time-text">00:00</div>
        <div class="theme-display" id="theme-text">현재 시간 동기화 중...</div>
    </div>
    
    <!-- 컨트롤 패널 -->
    <div id="control-panel">
        <div class="control-group">
            <button class="icon-btn" id="btn-fullscreen" title="전체화면">⛶</button>
            <div style="width: 1px; height: 12px; background: rgba(255,255,255,0.2);"></div>
            <button class="text-btn active" id="btn-auto">Auto (실시간)</button>
        </div>
        
        <!-- 24시간 연속 시간 조절 슬라이더 -->
        <div class="control-group slider-container">
            <span>🌙</span>
            <input type="range" id="time-slider" min="0" max="24" step="0.05" value="12">
            <span>☀️</span>
        </div>
    </div>

    <div class="instruction" id="instruction-text">슬라이더를 조절하여 시간의 변화를 감상해보세요</div>

    <!-- 인트로 화면 -->
    <div id="intro-layer">
        <div class="title-group">
            <h1>윤슬의 숨결</h1>
            <div class="subtitle">Fragments of Time</div>
        </div>
        <button id="start-btn">작품 감상하기</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // 1. WebGL & Raymarching Shader Setup
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0)); 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const uniforms = {
            u_time: { value: 0.0 },
            u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
            u_sunDirection: { value: new THREE.Vector3(0, 0.2, 1).normalize() },
            u_waterColor: { value: new THREE.Vector3() },
            u_skyBottom: { value: new THREE.Vector3() },
            u_skyTop: { value: new THREE.Vector3() },
            u_sunColor: { value: new THREE.Vector3() },
            u_isNight: { value: 0.0 },
            u_waveParams: { value: new THREE.Vector4(0.32, 2.2, 0.16, 0.0) } // x: height, y: choppy, z: speed, w: sunsetGlow
        };

        const fragmentShader = `
            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec3 u_sunDirection;
            uniform vec3 u_waterColor;
            uniform vec3 u_skyBottom;
            uniform vec3 u_skyTop;
            uniform vec3 u_sunColor;
            uniform float u_isNight;
            uniform vec4 u_waveParams;

            const int NUM_STEPS = 45;

            mat2 rot(float a) { float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

            float hash(vec2 p) {
                float h = dot(p, vec2(127.1, 311.7));
                return fract(sin(h) * 43758.5453123);
            }
            
            float noise(in vec2 p) {
                vec2 i = floor(p);
                vec2 f = fract(p);
                vec2 u = f * f * (3.0 - 2.0 * f);
                return -1.0 + 2.0 * mix(
                    mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
                    mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), 
                u.y);
            }

            // 바다 물결 지오메트리
            float sea_octave(vec2 uv, float choppy) {
                uv += noise(uv);
                vec2 wv = 1.0 - abs(sin(uv));
                vec2 swv = abs(cos(uv));
                wv = mix(wv, swv, wv);
                return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
            }

            float map(vec3 p, vec3 ori) {
                float freq = 0.16;
                float amp = u_waveParams.x;    
                float choppy = u_waveParams.y; 
                float speed = u_waveParams.z;
                vec2 uv = p.xz; uv.x *= 0.75;

                float dist = length(p.xz - ori.xz);
                float detailFade = smoothstep(120.0, 8.0, dist);

                float d, h = 0.0;
                for(int i = 0; i < 5; i++) { 
                    float t = u_time * speed;
                    d = sea_octave((uv + t) * freq, choppy);
                    d += sea_octave((uv - t) * freq, choppy);
                    
                    float weight = (i > 1) ? mix(0.25, 1.0, detailFade) : 1.0;
                    h += d * amp * weight;
                    
                    uv *= mat2(1.6, 1.2, -1.2, 1.6);
                    freq *= 1.9;
                    amp *= 0.22;
                    choppy = mix(choppy, 1.0, 0.2);
                }
                return p.y - h;
            }

            vec3 getNormal(vec3 p, vec3 ori) {
                vec3 n;
                float dist = length(p - ori);
                float eps = max(0.001, dist * 0.0008);
                
                n.y = map(p, ori);
                n.x = map(vec3(p.x + eps, p.y, p.z), ori) - n.y;
                n.z = map(vec3(p.x, p.y, p.z + eps), ori) - n.y;
                n.y = eps;
                return normalize(n);
            }

            float heightMapTracing(vec3 ori, vec3 dir, out vec3 p) {
                float tm = 0.0;
                float tx = 1000.0;
                float hx = map(ori + dir * tx, ori);
                if(hx > 0.0) return tx;
                float hm = map(ori + dir * tm, ori);
                float tmid = 0.0;
                for(int i = 0; i < NUM_STEPS; i++) {
                    tmid = mix(tm, tx, hm / (hm - hx));
                    p = ori + dir * tmid;
                    float hmid = map(p, ori);
                    if(hmid < 0.0) {
                        tx = tmid;
                        hx = hmid;
                    } else {
                        tm = tmid;
                        hm = hmid;
                    }
                }
                return tmid;
            }

            // 하늘 및 광원
            vec3 getSkyColor(vec3 e) {
                e.y = max(e.y, 0.0);
                vec3 sky = mix(u_skyBottom, u_skyTop, pow(e.y, 0.85));
                
                float sun = max(0.0, dot(e, u_sunDirection));
                float sunsetGlow = u_waveParams.w; 
                
                float corePow = mix(512.0, 256.0, sunsetGlow);
                sky += u_sunColor * pow(sun, corePow) * (2.0 + sunsetGlow * 1.5);
                sky += u_sunColor * pow(sun, 64.0) * (0.8 + sunsetGlow * 0.8);
                sky += u_sunColor * pow(sun, 16.0) * (0.3 + sunsetGlow * 0.6);
                sky += u_sunColor * pow(sun, 4.0) * (0.1 + sunsetGlow * 0.4);

                // 밤하늘 별빛
                if (u_isNight > 0.1) {
                    float s = noise(e.xz * 350.0);
                    if(s > 0.94) {
                        sky += vec3(1.0) * pow((s - 0.94)*16.0, 2.0) * (1.0 - e.y) * u_isNight;
                    }
                }
                return sky;
            }

            // 수면 색상 및 초실사 윤슬
            vec3 getSeaColor(vec3 p, vec3 n, vec3 l, vec3 eye, vec3 ori) {
                float dist = length(p - ori);
                float fresnel = clamp(1.0 - dot(n, -eye), 0.0, 1.0);
                fresnel = pow(fresnel, 3.0) * 0.65;
                
                vec3 reflected = getSkyColor(reflect(eye, n));
                vec3 refracted = u_waterColor + vec3(0.0, 0.02, 0.05) * (1.0 - fresnel); 
                
                float sunsetGlow = u_waveParams.w;
                float sss = pow(max(0.0, dot(eye, reflect(l, n))), 4.0) * (0.15 + sunsetGlow * 0.2);
                refracted += u_sunColor * sss * u_waterColor;

                vec3 color = mix(refracted, reflected, fresnel);

                // 스펙큘러 하이라이트
                vec3 ref = reflect(eye, n);
                float specBase = max(0.0, dot(ref, l));
                
                float specExp = mix(500.0, 20.0, smoothstep(5.0, 90.0, dist));
                float specIntensity = mix(14.0 + sunsetGlow * 6.0, 1.8, smoothstep(10.0, 100.0, dist));
                
                float specSharp = pow(specBase, specExp);
                color += u_sunColor * specSharp * specIntensity;
                
                float specSoft = pow(specBase, mix(40.0 - sunsetGlow * 20.0, 6.0, smoothstep(5.0, 70.0, dist)));
                color += u_sunColor * specSoft * (0.7 + sunsetGlow * 1.0);

                return color;
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                uv = uv * 2.0 - 1.0;
                uv.x *= u_resolution.x / u_resolution.y;

                float time = u_time * 0.3;
                vec3 ori = vec3(0.0, 1.4, time * 1.5);
                vec3 dir = normalize(vec3(uv.xy, -2.5)); // 고정 시점

                vec3 p;
                heightMapTracing(ori, dir, p);
                vec3 n = getNormal(p, ori);
                vec3 light = normalize(u_sunDirection);

                vec3 color = mix(
                    getSkyColor(dir),
                    getSeaColor(p, n, light, dir, ori),
                    pow(smoothstep(0.0, -0.04, dir.y), 0.3)
                );

                // 한밤중에는 칠흑같이 어두워지도록 노출(Exposure) 제어
                float exposure = mix(1.2, 0.6, u_isNight);
                color = color * exposure; 
                
                // ACES Filmic Tonemapping
                color = (color * (2.51 * color + 0.03)) / (color * (2.43 * color + 0.59) + 0.14);
                
                // 비네팅
                float vignette = length(uv) * 0.5;
                color *= 1.0 - vignette * vignette * 0.4;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms: uniforms,
            vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
            fragmentShader: fragmentShader
        });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(plane);

        // ==========================================
        // 2. 13단계 정밀 시간대별 키프레임 데이터
        // ==========================================
        let isAutoMode = true;

        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1,3), 16) / 255,
                parseInt(hex.slice(3,5), 16) / 255,
                parseInt(hex.slice(5,7), 16) / 255
            ];
        }

        // 13단계 초정밀 24시간 타임라인 데이터
        const timeKeyframes = [
            { time: 0.0,  w: '#010206', sb: '#02040a', st: '#000103', sun: '#88a2c4', ang: 0.35,  n: 1.0, desc: '심야의 깊은 칠흑 바다', wave: [0.28, 2.0, 0.12, 0.0] },
            { time: 3.5,  w: '#010206', sb: '#02040a', st: '#000103', sun: '#88a2c4', ang: 0.28,  n: 1.0, desc: '달빛 아래 정적의 밤', wave: [0.26, 1.9, 0.11, 0.0] },
            { time: 4.8,  w: '#030612', sb: '#070f24', st: '#01030a', sun: '#7192bd', ang: 0.15,  n: 0.9, desc: '새벽을 기다리는 푸른 어둠', wave: [0.27, 2.0, 0.12, 0.0] },
            { time: 5.8,  w: '#091526', sb: '#3d2b45', st: '#0e1c33', sun: '#ffb399', ang: 0.02,  n: 0.3, desc: '여명의 시작 (Pre-Dawn)', wave: [0.29, 2.1, 0.13, 0.2] },
            { time: 6.8,  w: '#0e233a', sb: '#e6906c', st: '#2b5278', sun: '#ffe4c2', ang: 0.08,  n: 0.0, desc: '황금빛 일출 (Golden Dawn)', wave: [0.32, 2.2, 0.15, 0.4] },
            { time: 8.5,  w: '#0a2a4c', sb: '#a8d2f0', st: '#1d4f82', sun: '#fffdf5', ang: 0.22,  n: 0.0, desc: '아침의 맑은 산란', wave: [0.34, 2.3, 0.18, 0.0] },
            { time: 12.5, w: '#041d3d', sb: '#68a8e0', st: '#103c6b', sun: '#ffffff', ang: 0.48,  n: 0.0, desc: '생동하는 한낮의 바다', wave: [0.38, 2.5, 0.22, 0.0] },
            { time: 15.5, w: '#0e2440', sb: '#d49b6a', st: '#2d4061', sun: '#fff0d1', ang: 0.25,  n: 0.0, desc: '나른한 오후의 윤슬', wave: [0.33, 2.2, 0.16, 0.2] },
            { time: 17.2, w: '#241312', sb: '#ed6c37', st: '#542d4a', sun: '#ffd18c', ang: 0.08,  n: 0.0, desc: '황금빛 노을의 서막', wave: [0.30, 2.1, 0.14, 0.6] },
            { time: 18.2, w: '#300a08', sb: '#ff3b14', st: '#4d103b', sun: '#ffa033', ang: -0.01, n: 0.0, desc: '최정점의 노을 (Crimson Sunset)', wave: [0.27, 2.0, 0.13, 1.0] },
            { time: 19.2, w: '#140c1e', sb: '#38173d', st: '#0a0817', sun: '#d66b7a', ang: -0.08, n: 0.0, desc: '트와일라잇 매직아워', wave: [0.28, 2.0, 0.13, 0.3] },
            { time: 20.5, w: '#040714', sb: '#0a1429', st: '#01030a', sun: '#89a8cb', ang: 0.18,  n: 0.7, desc: '초여녁의 고요한 침묵', wave: [0.29, 2.0, 0.14, 0.0] },
            { time: 24.0, w: '#010206', sb: '#02040a', st: '#000103', sun: '#88a2c4', ang: 0.35,  n: 1.0, desc: '심야의 깊은 칠흑 바다', wave: [0.28, 2.0, 0.12, 0.0] }
        ];

        function lerp(a, b, t) { return a + (b - a) * t; }
        function lerpArr(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }

        function getEnvironmentAtTime(t) {
            t = (t + 24) % 24;
            let k1 = timeKeyframes[0], k2 = timeKeyframes[timeKeyframes.length - 1];
            
            for (let i = 0; i < timeKeyframes.length - 1; i++) {
                if (t >= timeKeyframes[i].time && t <= timeKeyframes[i+1].time) {
                    k1 = timeKeyframes[i];
                    k2 = timeKeyframes[i+1];
                    break;
                }
            }

            const factor = (t - k1.time) / (k2.time - k1.time);
            
            return {
                w: lerpArr(hexToRgb(k1.w), hexToRgb(k2.w), factor),
                sb: lerpArr(hexToRgb(k1.sb), hexToRgb(k2.sb), factor),
                st: lerpArr(hexToRgb(k1.st), hexToRgb(k2.st), factor),
                sun: lerpArr(hexToRgb(k1.sun), hexToRgb(k2.sun), factor),
                ang: lerp(k1.ang, k2.ang, factor),
                n: lerp(k1.n, k2.n, factor),
                wave: lerpArr(k1.wave, k2.wave, factor),
                desc: factor < 0.5 ? k1.desc : k2.desc
            };
        }

        function updateEnvironment(currentTimeFloat) {
            const h = Math.floor(currentTimeFloat);
            const m = Math.floor((currentTimeFloat % 1) * 60);
            document.getElementById('time-text').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;

            const env = getEnvironmentAtTime(currentTimeFloat);
            document.getElementById('theme-text').innerText = env.desc;

            uniforms.u_waterColor.value.fromArray(env.w);
            uniforms.u_skyBottom.value.fromArray(env.sb);
            uniforms.u_skyTop.value.fromArray(env.st);
            uniforms.u_sunColor.value.fromArray(env.sun);
            uniforms.u_waveParams.value.fromArray(env.wave);
            
            uniforms.u_isNight.value = env.n;
            uniforms.u_sunDirection.value.set(0, env.ang, -1.0).normalize();
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // 3. UI 및 컨트롤 이벤트
        // ==========================================
        const timeSlider = document.getElementById('time-slider');
        const btnAuto = document.getElementById('btn-auto');

        document.getElementById('start-btn').addEventListener('click', () => {
            const intro = document.getElementById('intro-layer');
            intro.style.opacity = '0';
            setTimeout(() => { intro.style.display = 'none'; }, 1500);
            
            document.getElementById('info-panel').style.opacity = '1';
            document.getElementById('control-panel').style.opacity = '1';
            
            const inst = document.getElementById('instruction-text');
            inst.style.opacity = '1';
            setTimeout(() => { inst.style.opacity = '0'; }, 5000);
        });

        timeSlider.addEventListener('input', (e) => {
            isAutoMode = false;
            btnAuto.classList.remove('active');
            updateEnvironment(parseFloat(e.target.value));
        });

        btnAuto.addEventListener('click', () => {
            isAutoMode = true;
            btnAuto.classList.add('active');
            syncToRealtime();
        });

        function syncToRealtime() {
            const now = new Date();
            const t = now.getHours() + now.getMinutes() / 60;
            timeSlider.value = t;
            updateEnvironment(t);
        }

        const btnFullscreen = document.getElementById('btn-fullscreen');
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // ==========================================
        // 4. 메인 렌더 루프
        // ==========================================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            uniforms.u_time.value = elapsedTime;

            if (isAutoMode) {
                syncToRealtime();
            }

            renderer.render(scene, camera);
        }

        syncToRealtime();
        animate();
    </script>
</body>
</html>
