<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHIVE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg: #08080a;
      --text-main: #ececec;
      --text-sub: #71717a;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      margin-bottom: 70px;
      text-align: center;
    }

    .gallery-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
    }

    .gallery-grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px; /* 카드가 3개가 되었으므로 최대 너비를 살짝 늘렸습니다 */
      width: 100%;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px 28px;
      width: 300px;
      text-decoration: none;
      color: inherit;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.035);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .card-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.6;
      font-weight: 300;
      word-break: keep-all;
    }
  </style>
</head>
<body>

  <header>
    <div class="gallery-title">ARCHIVE</div>
  </header>

  <div class="gallery-grid">
    <a href="./Art/flowfield/" class="card">
      <div>
        <div class="card-num">01</div>
        <h2 class="card-title">Flow Field</h2>
      </div>
      <p class="card-desc">파티클 필드를 통한 명화의 해체와 재구성</p>
    </a>

    <a href="./Art/hojak/" class="card">
      <div>
        <div class="card-num">02</div>
        <h2 class="card-title">Hojak</h2>
      </div>
      <p class="card-desc">민화적 도상의 현대적 시각화 및 재해석</p>
    </a>

    <a href="./Art/Yoonseul/" class="card">
      <div>
        <div class="card-num">03</div>
        <h2 class="card-title">Yoonseul</h2>
      </div>
      <p class="card-desc">수면 위로 부서지는 빛과 잔물결의 궤적</p>
    </a>
  </div>

</body>
</html>
